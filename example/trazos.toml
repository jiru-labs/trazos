# Site settings for one artist. Copy this folder to start your own archive.
artist = "Ada"                # the only name the site shows: a first name or a pseudonym
title = "The art of Ada"      # optional; defaults to "The art of <artist>" / "Las obras de <artist>"
lang = "en"                   # "en" or "es"
protect = true                # keep search engines and AI crawlers out (robots.txt + meta)
# admin = "you/your-archive"   # adds a login page at /admin/ that edits this repo (see README, Admin mode)
