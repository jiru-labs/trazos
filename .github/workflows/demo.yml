# Builds example/ and publishes it as the live demo of trazos.
name: Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 build.py example
      - uses: actions/upload-pages-artifact@v5
        with:
          path: example/public
      - id: deploy
        uses: actions/deploy-pages@v5
